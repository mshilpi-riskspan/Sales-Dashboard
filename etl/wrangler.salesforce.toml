name = "riskspan-etl-salesforce"
account_id = "95c65ea66e1a33027efee8fcc220a91f"
main = "src/workers/salesforce.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["32 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "ETL_KV"
id = "df4095b0f93d41c288ca52831c2b1f17"

[vars]
SNOWFLAKE_DATABASE = "RS_INTERNAL"
SNOWFLAKE_SCHEMA   = "RISKSPAN_DASHBOARD_INTERNAL"
SNOWFLAKE_ROLE     = "INNOVATION_RW_ROLE"

# Secrets: SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PRIVATE_KEY, SNOWFLAKE_WAREHOUSE
#          SF_LOGIN_URL, SF_USERNAME, SF_PASSWORD, SF_SECURITY_TOKEN
