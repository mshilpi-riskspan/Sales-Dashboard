name = "riskspan-dashboard-etl"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "ETL_KV"
id = "PLACEHOLDER_UPDATE_WITH_NEW_ACCOUNT_KV_ID"

[vars]
SNOWFLAKE_DATABASE = "RS_INTERNAL"
SNOWFLAKE_SCHEMA   = "RISKSPAN_DASHBOARD_INTERNAL"
SNOWFLAKE_ROLE     = "INNOVATION_RW_ROLE"

# Secrets — set via: wrangler secret put <NAME>
# SNOWFLAKE_ACCOUNT
# SNOWFLAKE_USER
# SNOWFLAKE_PRIVATE_KEY
# SNOWFLAKE_WAREHOUSE
# FRESHDESK_API_KEY
# FRESHDESK_DOMAIN
# JIRA_BASE_URL
# JIRA_USERNAME
# JIRA_API_TOKEN
# MAXIO_API_TOKEN
# MAXIO_BASE_URL
# SF_LOGIN_URL
# SF_USERNAME
# SF_PASSWORD
# SF_SECURITY_TOKEN
# ASTRO_API_TOKEN
# ASTRO_BASE_URL
